name: Renovate

on:
  schedule:
    - cron: "17 4 * * 1-5"
  workflow_dispatch:
    inputs:
      debug:
        description: "Debug-loglevel"
        type: boolean
        default: false

# Niet overlappen met zichzelf; een tweede start wacht tot de eerste klaar is.
concurrency:
  group: renovate
  cancel-in-progress: false

env:
  RENOVATE_VERSION: 44.164.10 # renovate: datasource=npm depName=renovate

jobs:
  renovate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Run Renovate
        env:
          RENOVATE_TOKEN: ${{ secrets.RENOVATE_TOKEN }}
          LOG_LEVEL: ${{ github.event.inputs.debug == 'true' && 'debug' || 'info' }}
        shell: bash
        run: |
          docker run --rm \
            --memory=6g \
            --memory-swap=6g \
            -e RENOVATE_PLATFORM=gitea \
            -e RENOVATE_ENDPOINT=https://gitlab.epicnabbo.nl/ \
            -e RENOVATE_TOKEN \
            -e RENOVATE_REPOSITORIES='["remco/EpicNext-Cms"]' \
            -e RENOVATE_AUTODISCOVER=false \
            -e RENOVATE_BINARY_SOURCE=install \
            -e LOG_LEVEL \
            -e RENOVATE_ONBOARDING=true \
            -e RENOVATE_REQUIRE_CONFIG=required \
            "renovate/renovate:${RENOVATE_VERSION}"
